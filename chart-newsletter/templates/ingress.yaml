apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listmonk
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - secretName: listmonk-tls
      hosts:
        - {{ .Values.host }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: listmonk
                port:
                  number: 9000
