apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: listmonk-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: listmonk-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: postgres-password
              command:
                - sh
                - -c
                - |
                  set -eu
                  f=/backups/listmonk-$(date +%Y-%m-%d).sql.gz
                  pg_dump -h listmonk-db -U listmonk listmonk | gzip > "$f.tmp"
                  mv "$f.tmp" "$f"
                  find /backups -name 'listmonk-*.sql.gz' -mtime +{{ .Values.backup.keepDays }} -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: listmonk-backups
