{{- if .Values.redirectHosts }}
# Permanent, path- and query-preserving redirect of redirectHosts to redirectTarget.
# e.g. https://tereziekos.cz/abc?x=1  ->  https://tereziealder.cz/abc?x=1
# 301 for GET/HEAD, 308 otherwise.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)$
    replacement: {{ .Values.redirectTarget }}${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teri-coaching-redirect
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
    # Routed on both entry points so http:// goes straight to the target in one hop.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: teri-coaching-redirect-tls
      hosts:
        {{- range .Values.redirectHosts }}
        - {{ . }}
        {{- end }}
  rules:
    {{- range .Values.redirectHosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Never reached; the middleware answers.
                name: teri-coaching
                port:
                  number: 80
    {{- end }}
{{- end }}
